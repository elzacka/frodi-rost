name: Frodi
options:
  bundleIdPrefix: com.Tazk
  deploymentTarget:
    iOS: "27.0"
  xcodeVersion: "27.0"
  developmentLanguage: nb
  generateEmptyDirectories: true
settings:
  base:
    # Language mode, not toolchain version. Valid values: 4, 4.2, 5, 6.
    SWIFT_VERSION: "6"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: Frodi/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    PRODUCT_BUNDLE_IDENTIFIER: com.Tazk.Frodi
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "6"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: true
    ENABLE_USER_SCRIPT_SANDBOXING: true
    # Xcode 27's recommended settings; without them the project carries an
    # "Update to recommended settings" issue on every open.
    STRING_CATALOG_GENERATE_SYMBOLS: true
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
packages:
  # Pinned, not a range. A fresh clone must build the same binary that was
  # reviewed, and Package.resolved is committed for the transitive packages.
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: "1.1.0"
targets:
  Frodi:
    type: application
    platform: iOS
    sources:
      - path: Frodi
        excludes:
          - "**/.DS_Store"
          # The model is added as a folder reference under resources. Without this
          # exclusion, sources picks it up as well, and the two config.json files
          # collide in the app bundle.
          - "Resources/Model"
      # A folder reference, not individual files. Keeps the directory structure,
      # which WhisperKit requires for the tokenizer, and prevents the two
      # config.json files from colliding at the root of the app bundle.
      - path: Frodi/Resources/Model
        type: folder
        buildPhase: resources
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    # nb-whisper is the app's only engine. A build without it must fail here,
    # not ship. The two files are the ones WhisperTranscriber.isBundled checks;
    # declared as inputs so the sandboxed script may read them.
    preBuildScripts:
      - name: Check bundled model
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/Frodi/Resources/Model/nb-whisper-small/config.json
          - $(SRCROOT)/Frodi/Resources/Model/tokenizer/models/openai/whisper-small/tokenizer.json
        script: |
          for f in "$SCRIPT_INPUT_FILE_0" "$SCRIPT_INPUT_FILE_1"; do
            if [ ! -f "$f" ]; then
              echo "error: nb-whisper is not in the build: $f is missing. Run Scripts/fetch-model.sh"
              exit 1
            fi
          done
    resources:
      - path: Frodi/Resources/Assets.xcassets
      - path: Frodi/Resources/Fonts
        buildPhase: resources
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 8NW62A7PRA
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
    info:
      path: Frodi/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: "Fróði røst"
        CFBundleLocalizations:
          - nb
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Skranji-Bold.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Recording must survive the screen locking. Without this iOS stops the
        # recording the moment the app goes to the background, which is exactly what
        # happens when you put the device down in the car.
        # audio: recording. processing: transcription on the charger, see
        # BackgroundTranscription.
        UIBackgroundModes: [audio, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.Tazk.Frodi.transcribe]
        NSMicrophoneUsageDescription: "Fróði bruker mikrofonen til å ta opp det du sier. Opptakene blir liggende på enheten."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIAccessibilityPerformEscapeEnabled: true
  FrodiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FrodiTests
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: Frodi
  FrodiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FrodiUITests
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: Frodi
schemes:
  Frodi:
    build:
      targets:
        Frodi: all
    run:
      config: Debug
    test:
      targets:
        - FrodiTests
        - FrodiUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
